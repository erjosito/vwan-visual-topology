name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:collector
      - name: Compile generated Bicep (no deployment)
        run: |
          az bicep install --version v0.40.2
          az bicep build --file test-artifacts/azure-files/bicep/main.bicep --stdout > test-artifacts/azure-files/bicep/main.json
          az bicep build --file test-artifacts/azure-files/bicep/single-hub.bicep --stdout > test-artifacts/azure-files/bicep/single-hub.json
          az bicep build --file test-artifacts/azure-files/bicep/ars-policies.bicep --stdout > test-artifacts/azure-files/bicep/ars-policies.json
      - run: npm run build
        env:
          VITE_APP_REVISION: ${{ github.sha }}
      - name: Run browser suite with matching preinstalled browsers
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --init --ipc=host -e CI=true \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            npm run test:e2e -- --workers=2
      - name: Smoke exact production artifact with SWA headers
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --init --ipc=host -e CI=true \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            npm run test:production -- --workers=2
          docker run --rm --init --ipc=host \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            npm run measure:production -- test-results/production-measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-measurements
          path: test-results/production-measurements.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            test-artifacts/production-playwright/
          retention-days: 7

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run test:desktop-cli
      - run: npm run build:desktop
      - run: npm run test:desktop
      - name: Smoke packaged offline application
        shell: pwsh
        run: |
          $env:DESKTOP_EXECUTABLE = Join-Path (Get-Location) 'release\win-unpacked\Azure Network Simulator.exe'
          npm run test:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record development installer checksum
        shell: pwsh
        run: |
          Get-FileHash release\Azure-Network-Simulator-*-x64.exe -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json |
            Set-Content test-artifacts\desktop\installer-sha256.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-development-build
          path: |
            release/Azure-Network-Simulator-*-x64.exe
            test-artifacts/desktop/*checks.json
            test-artifacts/desktop/*sha256.json
          retention-days: 7

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: azure-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist
      - name: Deploy validated static assets
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locate configured Node runtime for browser containers
        run: echo "CI_NODE_HOME=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix functions/user-cloud
      - run: npm run build:user-cloud
      - run: node --test scripts/release-candidate.test.mjs scripts/collect-github-statistics.test.mjs scripts/github-statistics-function.test.mjs scripts/github-statistics-dashboard.test.mjs scripts/github-statistics-swa.test.mjs scripts/external-reports.test.mjs
      - run: npm run lint
      - run: npm run test:evaluation
      - run: npm test
      - run: npm run test:collector
      - name: Compile generated Bicep (no deployment)
        run: |
          az bicep install --version v0.40.2
          az bicep build --file test-artifacts/azure-files/bicep/main.bicep --stdout > test-artifacts/azure-files/bicep/main.json
          az bicep build --file test-artifacts/azure-files/bicep/single-hub.bicep --stdout > test-artifacts/azure-files/bicep/single-hub.json
          az bicep build --file test-artifacts/azure-files/bicep/ars-policies.bicep --stdout > test-artifacts/azure-files/bicep/ars-policies.json
          az bicep build --file test-artifacts/azure-files/bicep/nat-egress.bicep --stdout > test-artifacts/azure-files/bicep/nat-egress.json
          az bicep build --file infra/github-statistics.bicep --stdout > "$RUNNER_TEMP/github-statistics.json"
          az bicep build --file infra/github-statistics-auth.bicep --stdout > "$RUNNER_TEMP/github-statistics-auth.json"
          az bicep build --file infra/github-statistics-domain-dns.bicep --stdout > "$RUNNER_TEMP/github-statistics-domain-dns.json"
          az bicep build --file infra/github-statistics-domain-certificate.bicep --stdout > "$RUNNER_TEMP/github-statistics-domain-certificate.json"
          az bicep build --file infra/github-statistics-domain.bicep --stdout > "$RUNNER_TEMP/github-statistics-domain.json"
          az bicep build --file infra/user-cloud.bicep --stdout > "$RUNNER_TEMP/user-cloud.json"
          az bicep build --file test-artifacts/azure-files/bicep/connectivity-public-lb.bicep --stdout > test-artifacts/azure-files/bicep/connectivity-public-lb.json
          az bicep build --file test-artifacts/azure-files/bicep/connectivity-private-lb.bicep --stdout > test-artifacts/azure-files/bicep/connectivity-private-lb.json
          az bicep build --file test-artifacts/azure-files/bicep/connectivity-firewall-dnat.bicep --stdout > test-artifacts/azure-files/bicep/connectivity-firewall-dnat.json
          az bicep build --file test-artifacts/azure-files/bicep/connectivity-nat-lb.bicep --stdout > test-artifacts/azure-files/bicep/connectivity-nat-lb.json
          az bicep build --file test-artifacts/azure-files/bicep/connectivity-native-vwan.bicep --stdout > test-artifacts/azure-files/bicep/connectivity-native-vwan.json
      - run: npm run build
        env:
          VITE_APP_REVISION: ${{ github.sha }}
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID }}
          VITE_CLOUD_API_SCOPE: ${{ vars.VITE_CLOUD_API_SCOPE }}
          VITE_CLOUD_API_BASE_URL: ${{ vars.VITE_CLOUD_API_BASE_URL }}
      - name: Run browser suite with matching preinstalled browsers
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --init --ipc=host -e CI=true \
            -v "$CI_NODE_HOME:/opt/ci-node:ro" \
            -e PATH=/opt/ci-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            bash -ec 'node --version; exec xvfb-run -a npm run test:e2e -- --workers=2'
      - name: Smoke exact production artifact with SWA headers
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --init --ipc=host -e CI=true \
            -v "$CI_NODE_HOME:/opt/ci-node:ro" \
            -e PATH=/opt/ci-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            npm run test:production -- --workers=2
          docker run --rm --init --ipc=host \
            -v "$CI_NODE_HOME:/opt/ci-node:ro" \
            -e PATH=/opt/ci-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            npm run measure:production -- test-results/production-measurements.json
      - name: Gate the versioned whole-document accessibility sample
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --init --ipc=host \
            -v "$CI_NODE_HOME:/opt/ci-node:ro" \
            -e PATH=/opt/ci-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v${version}-noble" \
            npm run evaluate:accessibility
      - name: Preserve actual accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-accessibility
          overwrite: true
          path: test-artifacts/quality/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve shared presentation acceptance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: presentation-acceptance
          overwrite: true
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: production-measurements
          overwrite: true
          path: test-results/production-measurements.json
          retention-days: 7
      - name: Package locked statistics Function candidate (no deployment)
        run: |
          node scripts/package-github-statistics-function.mjs
          npm ci --omit=dev --prefix test-artifacts/github-statistics-function
          cd test-artifacts/github-statistics-function
          zip -q -r ../github-statistics-function.zip .
      - name: Package locked user-cloud Function candidate (no deployment)
        run: |
          node scripts/package-user-cloud-function.mjs
          npm ci --omit=dev --prefix test-artifacts/user-cloud-function
          cd test-artifacts/user-cloud-function
          zip -q -r ../user-cloud-function.zip .
      - name: Record immutable release candidates
        run: |
          node scripts/release-candidate.mjs create web
          node scripts/release-candidate.mjs create statistics
          node scripts/release-candidate.mjs create user-cloud
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.run_attempt }}
          path: test-artifacts/candidates/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: statistics-function-${{ github.run_attempt }}
          path: test-artifacts/candidates/statistics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: user-cloud-function-${{ github.run_attempt }}
          path: test-artifacts/candidates/user-cloud/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          overwrite: true
          path: |
            test-results/
            test-artifacts/production-playwright/
          retention-days: 7

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run test:desktop-cli
      - name: Read candidate semantic version from package.json
        run: node scripts/release-candidate.mjs prepare-desktop
      - run: npm run build:desktop
        env:
          VITE_APP_REVISION: ${{ github.sha }}
      - run: npm run test:desktop
      - run: npm run test:desktop-network
      - name: Smoke packaged offline application
        shell: pwsh
        run: |
          $env:DESKTOP_EXECUTABLE = Join-Path (Get-Location) 'release\win-unpacked\Azure Network Simulator.exe'
          npm run test:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:desktop-network
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record development installer checksum
        shell: pwsh
        run: |
          Get-FileHash release\Azure-Network-Simulator-*-x64.exe -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json |
            Set-Content test-artifacts\desktop\installer-sha256.json
          $info = (Get-Item "release\win-unpacked\Azure Network Simulator.exe").VersionInfo
          $runtimeVersion = (Get-Content test-artifacts\desktop\packaged-checks.json -Raw | ConvertFrom-Json).runtime.version
          @{
            fileVersion = $info.FileVersion
            productVersion = $info.ProductVersion
            runtimeVersion = $runtimeVersion
            buildVersion = $env:CANDIDATE_VERSION
            packageVersion = $env:CANDIDATE_PACKAGE_VERSION
          } | ConvertTo-Json | Set-Content test-artifacts\desktop\version-checks.json
          Get-Content test-artifacts\desktop\version-checks.json
          if ($info.FileVersion -ne $env:CANDIDATE_FILE_VERSION -or $info.ProductVersion -ne "$env:CANDIDATE_PACKAGE_VERSION.0" -or $runtimeVersion -ne $env:CANDIDATE_PACKAGE_VERSION) {
            throw 'Packaged executable resource/runtime versions do not match the recorded candidate identity'
          }
      - name: Record immutable desktop candidate
        run: node scripts/release-candidate.mjs create desktop
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-development-build-${{ github.run_attempt }}
          path: test-artifacts/candidates/desktop/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: Deploy statistics Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - functions/github-statistics/**
      - scripts/collect-github-statistics.mjs
      - scripts/package-github-statistics-function.mjs
      - .github/workflows/github-statistics.yml

permissions:
  contents: read

concurrency:
  group: github-statistics
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-statistics
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_STATS_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_STATS_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_STATS_SUBSCRIPTION_ID }}
          AZURE_FUNCTION_APP: ${{ vars.AZURE_STATS_FUNCTION_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_STATS_RESOURCE_GROUP }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_FUNCTION_APP AZURE_RESOURCE_GROUP; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing configuration: $name. See docs/github-statistics.md."
              exit 1
            fi
          done
      - name: Test collector and private persistence
        run: node --test scripts/collect-github-statistics.test.mjs scripts/github-statistics-function.test.mjs scripts/github-statistics-dashboard.test.mjs scripts/github-statistics-swa.test.mjs
      - name: Package locked Function dependencies
        run: |
          node scripts/package-github-statistics-function.mjs
          npm ci --omit=dev --prefix test-artifacts/github-statistics-function
          cd test-artifacts/github-statistics-function
          zip -q -r ../github-statistics-function.zip .
      - name: Sign in to Azure without a stored credential
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_STATS_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_STATS_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_STATS_SUBSCRIPTION_ID }}
      - name: Configure protected traffic credential
        env:
          TRAFFIC_TOKEN: ${{ secrets.GH_STATS_TRAFFIC_TOKEN }}
          AZURE_STATS_SWA_RESOURCE_ID: ${{ vars.AZURE_STATS_SWA_RESOURCE_ID }}
          AZURE_FUNCTION_APP: ${{ vars.AZURE_STATS_FUNCTION_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_STATS_RESOURCE_GROUP }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "::error::GH_STATS_TRAFFIC_TOKEN is required."
            exit 1
          fi
          settings=("GH_STATS_TRAFFIC_TOKEN=$TRAFFIC_TOKEN")
          if [ -n "$AZURE_STATS_SWA_RESOURCE_ID" ]; then
            settings+=("AZURE_STATS_SWA_RESOURCE_ID=$AZURE_STATS_SWA_RESOURCE_ID")
          fi
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP" \
            --settings "${settings[@]}" \
            --only-show-errors \
            --output none
      - name: Deploy Function package
        env:
          AZURE_FUNCTION_APP: ${{ vars.AZURE_STATS_FUNCTION_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_STATS_RESOURCE_GROUP }}
        run: |
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP" \
            --src test-artifacts/github-statistics-function.zip \
            --build-remote false \
            --timeout 600 \
            --only-show-errors \
            --output none
          echo "Function package deployed. Daily collection runs in Azure, not GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
